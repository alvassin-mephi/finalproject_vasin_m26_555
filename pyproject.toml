[project]
name = "finalproject-vasin-m26-555"
version = "0.1.0"
description = "Платформа для отслеживания и симуляции торговли валютами"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "prettytable>=3.18.0",
    "requests>=2.34.2",
]

[project.scripts]
valutatrade = "valutatrade_hub.cli.interface:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "valutatrade_hub"
module-root = ""

[tool.valutatrade]
USERS_FILE = "data/users.json"
PORTFOLIOS_FILE = "data/portfolios.json"
RATES_FILE = "data/rates.json"
HISTORY_FILE = "data/exchange_rates.json"
INITIAL_USD_BALANCE = 10_000.0
RATES_TTL_SECONDS = 300
UPDATE_INTERVAL_SECONDS = 300
DEFAULT_BASE_CURRENCY = "USD"
LOG_FILE = "logs/actions.log"
PARSER_LOG_FILE = "logs/parser.log"
LOG_FORMAT = "%(levelname)s %(asctime)s %(message)s"
LOG_LEVEL = "INFO"
LOG_MAX_BYTES = 1_048_576
LOG_BACKUP_COUNT = 3

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[dependency-groups]
dev = [
    "ruff>=0.17.2",
]
